name: transformers-aula
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - matplotlib
  - jupyterlab
  - ipykernel
  - ffmpeg                 # leitura de .mp3/.m4a (Gravador de Voz do Windows)
  - pip:
      # PyTorch VERSÃO CPU (Windows). Para GPU NVIDIA, veja o README.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - transformers>=4.40
      - soundfile
      - pyttsx3                # opcional: gera um áudio em português com a voz do Windows
